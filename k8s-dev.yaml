apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: fcg
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      - name: users-api
        url: http://users-api:8080
        routes:
          - name: users-register
            methods: [POST]
            paths: ["~/api/users$"]
            strip_path: false
          - name: users-login
            methods: [POST]
            paths: ["~/api/users/login$"]
            strip_path: false
          - name: users-wellknown
            methods: [GET]
            paths: ["/.well-known/"]
            strip_path: false
          - name: users-protected
            paths: ["/api/users"]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: iss
                  claims_to_verify: [exp]
                  run_on_preflight: true

      - name: catalog-api
        url: http://catalog-api:8080
        routes:
          - name: games-protected
            paths: ["/api/games"]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: iss
                  claims_to_verify: [exp]
                  run_on_preflight: true

      - name: swagger-ui
        url: http://swagger-ui:8080
        routes:
          - name: swagger
            paths: ["/swagger"]
            strip_path: false

    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PUT, DELETE, OPTIONS]
          headers: [Content-Type, Authorization]
          max_age: 300
          preflight_continue: false
      - name: rate-limiting
        config:
          second: 50
          policy: local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-entrypoint
  namespace: fcg
data:
  entrypoint.sh: |
    #!/usr/bin/env sh
    set -eu

    if [ -z "${JWT_RSA_PUBLIC_KEY_PEM:-}" ] && [ -n "${JWT_RSA_PUBLIC_KEY:-}" ]; then
      JWT_RSA_PUBLIC_KEY_PEM="$(printf '%s' "$JWT_RSA_PUBLIC_KEY" | base64 -d)"
    fi

    if [ -z "${JWT_RSA_PUBLIC_KEY_PEM:-}" ]; then
      echo "[kong] ERROR: defina JWT_RSA_PUBLIC_KEY_PEM ou JWT_RSA_PUBLIC_KEY" >&2
      exit 1
    fi

    SOURCE_CONFIG="${KONG_DECLARATIVE_CONFIG:-/etc/kong/kong.yml}"
    TARGET_CONFIG="/tmp/kong.resolved.yml"
    cp "$SOURCE_CONFIG" "$TARGET_CONFIG"

    {
      printf '\nconsumers:\n'
      printf '  - username: fcg-clients\n'
      printf '    jwt_secrets:\n'
      printf '      - key: FiapCloudGames\n'
      printf '        algorithm: RS256\n'
      printf '        rsa_public_key: |\n'
      printf '%s\n' "$JWT_RSA_PUBLIC_KEY_PEM" | sed 's/^/          /'
    } >> "$TARGET_CONFIG"

    export KONG_DECLARATIVE_CONFIG="$TARGET_CONFIG"
    exec /docker-entrypoint.sh "$@"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swagger-spec
  namespace: fcg
data:
  openapi.yaml: |
    openapi: 3.0.3
    info:
      title: FiapCloudGames API
      version: "1.0"
    servers:
      - url: http://localhost:8080
        description: Desenvolvimento local
    tags:
      - name: Authentication
      - name: Users
      - name: Games
      - name: Orders
    components:
      securitySchemes:
        bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
    security:
      - bearerAuth: []
    paths:
      /api/users/login:
        post:
          tags: [Authentication]
          summary: Authenticate user
          security: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [email, password]
                  properties:
                    email:    { type: string, format: email }
                    password: { type: string }
          responses:
            "200": { description: Token issued }
            "400": { description: Invalid credentials }
      /api/users:
        post:
          tags: [Users]
          summary: Register a new user
          security: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [name, email, password]
                  properties:
                    name:     { type: string }
                    email:    { type: string, format: email }
                    password: { type: string }
          responses:
            "200": { description: User created }
            "400": { description: Validation error }
        get:
          tags: [Users]
          summary: List users (Admin)
          responses:
            "200": { description: Paginated list }
      /api/games:
        get:
          tags: [Games]
          summary: List games
          responses:
            "200": { description: Games list }
        post:
          tags: [Games]
          summary: Register a game (Admin)
          responses:
            "200": { description: Game created }
      /api/games/library:
        get:
          tags: [Games]
          summary: User game library
          responses:
            "200": { description: Library }
      /api/games/purchase:
        post:
          tags: [Orders]
          summary: Purchase a game
          responses:
            "202": { description: Order accepted }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger-ui
  template:
    metadata:
      labels:
        app: swagger-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: swagger-ui
          image: swaggerapi/swagger-ui:v5.17.14
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: BASE_URL
              value: /swagger
            - name: URL
              value: /swagger/openapi.yaml
            - name: LAYOUT
              value: BaseLayout
            - name: DEEP_LINKING
              value: "true"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            - name: swagger-spec
              mountPath: /usr/share/nginx/html/swagger/openapi.yaml
              subPath: openapi.yaml
              readOnly: true
      volumes:
        - name: swagger-spec
          configMap:
            name: swagger-spec
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-ui
  namespace: fcg
spec:
  selector:
    app: swagger-ui
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: kong
          image: kong:3.7.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/fcg-entrypoint.sh"]
          args: ["kong", "docker-start"]
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PLUGINS
              value: "jwt,cors,rate-limiting"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: JWT_RSA_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: Jwt__RsaPublicKey
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /status
              port: status
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
              readOnly: true
            - name: kong-entrypoint
              mountPath: /usr/local/bin/fcg-entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: kong-prefix
              mountPath: /usr/local/kong
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
        - name: kong-entrypoint
          configMap:
            name: kong-entrypoint
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
        - name: kong-prefix
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fcg
spec:
  selector:
    app: api-gateway
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
  type: ClusterIP
