---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: fcg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "sqs,dynamodb,iam,logs,sts,cloudwatch,s3"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: DEBUG
              value: "0"
            - name: USERS_API_INTERNAL_URL
              value: "http://users-api.fcg.svc.cluster.local:8080"
            - name: CATALOG_API_INTERNAL_URL
              value: "http://catalog-api.fcg.svc.cluster.local:8080"
            - name: SKIP_LAMBDA
              value: "true"
            - name: LOCALSTACK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: localstack-auth
                  key: token
                  optional: true
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: fcg
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  Jwt__Issuer: "FiapCloudGames"
  Jwt__Audience: "FiapCloudGames"
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Username: "fcg_rmq"
  AWS__Region: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__Users: "Host=users-postgres;Port=5432;Database=users_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
  Jwt__RsaPrivateKey: "${JWT_RSA_PRIVATE_KEY}"
  Jwt__RsaPublicKey: "${JWT_RSA_PUBLIC_KEY}"
  RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
  Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: users-api-sqs
  namespace: fcg
type: Opaque
stringData:
  AWS__SQS__UserCreatedQueueUrl: "http://localstack:4566/000000000000/fcg-local-user-created-events"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_ENDPOINT_URL: "http://localstack:4566"
  AWS_ENDPOINT_URL_SQS: "http://localstack:4566"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z users-postgres 5432; do sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: users-api
          image: users-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          envFrom:
            - configMapRef:
                name: users-api-config
            - secretRef:
                name: users-api-secret
            - secretRef:
                name: users-api-sqs
                optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
