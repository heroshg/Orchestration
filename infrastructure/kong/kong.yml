# =============================================================================
# Kong API Gateway — declarative config (DB-less mode).
#
# Substitui o AWS API Gateway HTTP API v2 em ambiente local (docker-compose
# e Kubernetes). Espelha o roteamento e a autenticação JWT definidos em
# infrastructure/terraform/api_gateway.tf.
#
# Plugin JWT (Kong OSS) valida RS256 contra a chave pública RSA do consumer
# 'fcg-clients'. A chave vem da env JWT_RSA_PUBLIC_KEY_PEM (referenciada via
# vault://env). O claim 'iss' do token deve casar com o 'key' do JWT secret
# do consumer.
# =============================================================================
_format_version: "3.0"
_transform: true

services:

  # ─── UsersAPI ───────────────────────────────────────────────────────────────
  - name: users-api
    url: http://users-api:8080
    routes:
      # Públicos (sem JWT) ----------------------------------------------------
      - name: users-register
        methods: [POST]
        paths: ["~/api/users$"]
        strip_path: false
      - name: users-login
        methods: [POST]
        paths: ["~/api/users/login$"]
        strip_path: false
      - name: users-wellknown
        methods: [GET]
        paths: ["/.well-known/"]
        strip_path: false
      # Protegidos (JWT) ------------------------------------------------------
      - name: users-protected
        paths: ["/api/users"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: true

  # ─── CatalogAPI ─────────────────────────────────────────────────────────────
  - name: catalog-api
    url: http://catalog-api:8080
    routes:
      - name: games-protected
        paths: ["/api/games"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: true

  # ─── Swagger UI ─────────────────────────────────────────────────────────────
  # Spec único curado, descrevendo apenas o contrato exposto pelo gateway.
  - name: swagger-ui
    url: http://swagger-ui:8080
    routes:
      - name: swagger
        paths: ["/swagger"]
        strip_path: false

# ─── Consumers & JWT credentials ──────────────────────────────────────────────
# Bloco 'consumers' é APPENDADO em runtime pelo entrypoint.sh, que injeta a
# chave pública RSA a partir da env JWT_RSA_PUBLIC_KEY_PEM (ou decodifica
# JWT_RSA_PUBLIC_KEY base64). Necessário porque Kong valida PEM no parse.

# ─── CORS global ──────────────────────────────────────────────────────────────
# Mesma config do cors_configuration do api_gateway.tf.
plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: [GET, POST, PUT, DELETE, OPTIONS]
      headers: [Content-Type, Authorization]
      max_age: 300
      preflight_continue: false
  # Rate limit local — espelha throttling do API Gateway AWS (50 rps).
  - name: rate-limiting
    config:
      second: 50
      policy: local
