# =============================================================================
# Substituto local do AWS API Gateway HTTP API v2.
# Espelha o roteamento e o CORS de infrastructure/terraform/api_gateway.tf.
# Em produção o gateway real (provisionado pelo Terraform) cumpre esse papel.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Reproduz o throttling do gateway: 50 req/s sustentado, burst 100.
    limit_req_zone $binary_remote_addr zone=fcg_rate:10m rate=50r/s;

    upstream users_backend {
        server users-api:8080;
    }

    upstream catalog_backend {
        server catalog-api:8080;
    }

    upstream swagger_backend {
        server swagger-ui:8080;
    }

    map $request_method $cors_method {
        OPTIONS 1;
        default 0;
    }

    server {
        listen 8080;
        server_name _;

        # CORS — mesmo da cors_configuration do Terraform
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age       "300" always;

        # Preflight CORS
        if ($cors_method) {
            return 204;
        }

        # Health do próprio gateway
        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        # ── Swagger / OpenAPI ────────────────────────────────────────────────
        # Spec único curado, descrevendo apenas o contrato exposto pelo
        # gateway. Sem nenhuma referência à arquitetura interna.
        location = /swagger/openapi.yaml {
            alias /etc/nginx/openapi.yaml;
            default_type "application/yaml; charset=utf-8";
            add_header Cache-Control "no-cache" always;
        }

        # Bloqueio explícito: não vazar specs internos das APIs via gateway.
        # As APIs continuam expondo o próprio /swagger/v1/* internamente,
        # mas externamente isso responde 404.
        location ~ ^/swagger/v\d {
            return 404;
        }

        # Swagger UI agregador — só carrega o spec curado acima.
        location /swagger {
            proxy_pass         http://swagger_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # /api/users e /api/users/* → UsersAPI
        location /api/users {
            limit_req zone=fcg_rate burst=100 nodelay;
            proxy_pass         http://users_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # /api/games e /api/games/* → CatalogAPI
        location /api/games {
            limit_req zone=fcg_rate burst=100 nodelay;
            proxy_pass         http://catalog_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
