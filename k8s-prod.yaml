apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: kong
          image: kong:3.7.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/fcg-entrypoint.sh"]
          args: ["kong", "docker-start"]
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PLUGINS
              value: "jwt,cors,rate-limiting"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: JWT_RSA_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: Jwt__RsaPublicKey
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /status
              port: status
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
              readOnly: true
            - name: kong-entrypoint
              mountPath: /usr/local/bin/fcg-entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: kong-prefix
              mountPath: /usr/local/kong
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
        - name: kong-entrypoint
          configMap:
            name: kong-entrypoint
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
        - name: kong-prefix
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fcg
spec:
  selector:
    app: api-gateway
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
  type: ClusterIP
