apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: fcg
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      - name: users-api
        url: http://users-api:8080
        routes:
          - name: users-register
            methods: [POST]
            paths: ["~/api/users$"]
            strip_path: false
          - name: users-login
            methods: [POST]
            paths: ["~/api/users/login$"]
            strip_path: false
          - name: users-wellknown
            methods: [GET]
            paths: ["/.well-known/"]
            strip_path: false
          - name: users-protected
            paths: ["/api/users"]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: iss
                  claims_to_verify: [exp]
                  run_on_preflight: true

      - name: catalog-api
        url: http://catalog-api:8080
        routes:
          - name: games-protected
            paths: ["/api/games"]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: iss
                  claims_to_verify: [exp]
                  run_on_preflight: true

      - name: swagger-ui
        url: http://swagger-ui:8080
        routes:
          - name: swagger
            paths: ["/swagger"]
            strip_path: false

    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PUT, DELETE, OPTIONS]
          headers: [Content-Type, Authorization]
          max_age: 300
          preflight_continue: false
      - name: rate-limiting
        config:
          second: 50
          policy: local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-entrypoint
  namespace: fcg
data:
  entrypoint.sh: |
    #!/usr/bin/env sh
    set -eu

    if [ -z "${JWT_RSA_PUBLIC_KEY_PEM:-}" ] && [ -n "${JWT_RSA_PUBLIC_KEY:-}" ]; then
      JWT_RSA_PUBLIC_KEY_PEM="$(printf '%s' "$JWT_RSA_PUBLIC_KEY" | base64 -d)"
    fi

    if [ -z "${JWT_RSA_PUBLIC_KEY_PEM:-}" ]; then
      echo "[kong] ERROR: defina JWT_RSA_PUBLIC_KEY_PEM ou JWT_RSA_PUBLIC_KEY" >&2
      exit 1
    fi

    SOURCE_CONFIG="${KONG_DECLARATIVE_CONFIG:-/etc/kong/kong.yml}"
    TARGET_CONFIG="/tmp/kong.resolved.yml"
    cp "$SOURCE_CONFIG" "$TARGET_CONFIG"

    {
      printf '\nconsumers:\n'
      printf '  - username: fcg-clients\n'
      printf '    jwt_secrets:\n'
      printf '      - key: FiapCloudGames\n'
      printf '        algorithm: RS256\n'
      printf '        rsa_public_key: |\n'
      printf '%s\n' "$JWT_RSA_PUBLIC_KEY_PEM" | sed 's/^/          /'
    } >> "$TARGET_CONFIG"

    export KONG_DECLARATIVE_CONFIG="$TARGET_CONFIG"
    exec /docker-entrypoint.sh "$@"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swagger-spec
  namespace: fcg
data:
  openapi.yaml: |
    openapi: 3.0.3
    info:
      title: FiapCloudGames API
      version: "1.0"
    servers:
      - url: https://api.fiapcloudgames.com
        description: ProduÃ§Ã£o
    tags:
      - name: Authentication
      - name: Users
      - name: Games
      - name: Orders
    components:
      securitySchemes:
        bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
    security:
      - bearerAuth: []
    paths:
      /api/users/login:
        post:
          tags: [Authentication]
          summary: Authenticate user
          security: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [email, password]
                  properties:
                    email:    { type: string, format: email }
                    password: { type: string }
          responses:
            "200": { description: Token issued }
            "400": { description: Invalid credentials }
      /api/users:
        post:
          tags: [Users]
          summary: Register a new user
          security: []
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [name, email, password]
                  properties:
                    name:     { type: string }
                    email:    { type: string, format: email }
                    password: { type: string }
          responses:
            "200": { description: User created }
            "400": { description: Validation error }
        get:
          tags: [Users]
          summary: List users (Admin)
          responses:
            "200": { description: Paginated list }
      /api/games:
        get:
          tags: [Games]
          summary: List games
          responses:
            "200": { description: Games list }
        post:
          tags: [Games]
          summary: Register a game (Admin)
          responses:
            "200": { description: Game created }
      /api/games/library:
        get:
          tags: [Games]
          summary: User game library
          responses:
            "200": { description: Library }
      /api/games/purchase:
        post:
          tags: [Orders]
          summary: Purchase a game
          responses:
            "202": { description: Order accepted }
---
