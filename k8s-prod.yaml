---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datadog-agent-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: datadog-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
