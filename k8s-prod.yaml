        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
