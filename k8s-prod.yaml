apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "FiapCloudGames"
  Jwt__Audience: "FiapCloudGames"
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Username: "fcg_rmq"
  AWS__Region: "us-east-1"
  DD_SERVICE: "users-api"
  DD_ENV: "production"
  DD_VERSION: "1.0.0"
  DD_LOGS_INJECTION: "true"
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_TRACE_SAMPLE_RATE: "1.0"
  DD_PROFILING_ENABLED: "true"
  DD_DOTNET_TRACER_HOME: "/opt/datadog"
  CORECLR_ENABLE_PROFILING: "1"
  CORECLR_PROFILER: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
  CORECLR_PROFILER_PATH: "/opt/datadog/linux-musl-x64/Datadog.Trace.ClrProfiler.Native.so"
  LD_PRELOAD: "/opt/datadog/linux-musl-x64/Datadog.Linux.ApiWrapper.x64.so"
---
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__Users: "Host=users-postgres;Port=5432;Database=users_db;Username=postgres;Password=CHANGE_ME"
  Jwt__RsaPrivateKey: "CHANGE_ME_base64_pem"
  Jwt__RsaPublicKey: "CHANGE_ME_base64_pem"
  RabbitMQ__Password: "CHANGE_ME"
  Redis__ConnectionString: "redis:6379,password=CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: users-api-sqs
  namespace: fcg
type: Opaque
stringData:
  AWS__SQS__UserCreatedQueueUrl: "CHANGE_ME_terraform_output"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z users-postgres 5432; do sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: users-api
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/fcg-users-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          envFrom:
            - configMapRef:
                name: users-api-config
            - secretRef:
                name: users-api-secret
            - secretRef:
                name: users-api-sqs
                optional: true
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_DOGSTATSD_PORT
              value: "8125"
            - name: DD_TRACE_LOG_DIRECTORY
              value: "/tmp/dd-logs"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: fcg
spec:
  selector:
    app: users-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
