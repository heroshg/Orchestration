# ═══════════════════════════════════════════════════════════════════════════
# Datadog — Stack de Observabilidade (Opção B — APM gerenciado)
# ═══════════════════════════════════════════════════════════════════════════
#
# Componentes:
#   • Secret       — API key (crie manualmente: kubectl create secret ...)
#   • ConfigMap    — parâmetros não-sensíveis
#   • ServiceAccount + RBAC — leitura de métricas do kubelet/cAdvisor
#   • DaemonSet    — Datadog Agent (1 pod por node: APM, logs, métricas, traces)
#
# Pré-requisito (rode uma vez antes de aplicar este manifest):
#   kubectl create secret generic datadog-secret \
#       --from-literal=api-key=<SUA_DATADOG_API_KEY> \
#       -n fcg
#
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: ConfigMap
metadata:
  name: datadog-config
  namespace: fcg
data:
  DD_SITE: "datadoghq.com"
  DD_ENV: "production"
  DD_TAGS: "project:fiapcloudgames phase:3"
  DD_APM_ENABLED: "true"
  DD_APM_NON_LOCAL_TRAFFIC: "true"
  DD_LOGS_ENABLED: "true"
  DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
  DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION: "true"
  DD_CONTAINER_EXCLUDE: "image:gcr.io/datadoghq/agent*"
  DD_KUBELET_TLS_VERIFY: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  namespace: fcg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/spec", "nodes/proxy", "nodes/stats", "endpoints", "pods", "services", "componentstatuses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["quota.openshift.io"]
    resources: ["clusterresourcequotas"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/version", "/healthz", "/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent
subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: fcg
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  namespace: fcg
  labels:
    app: datadog-agent
spec:
  selector:
    matchLabels:
      app: datadog-agent
  template:
    metadata:
      labels:
        app: datadog-agent
      annotations:
        container.apparmor.security.beta.kubernetes.io/agent: unconfined
    spec:
      serviceAccountName: datadog-agent
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: gcr.io/datadoghq/agent:7.58.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8125
              name: dogstatsdport
              protocol: UDP
            - containerPort: 8126
              name: traceport
              protocol: TCP
          envFrom:
            - configMapRef:
                name: datadog-config
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
            - name: DD_KUBERNETES_KUBELET_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: dockersocket
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: procdir
              mountPath: /host/proc
              readOnly: true
            - name: cgroups
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: pointerdir
              mountPath: /opt/datadog-agent/run
            - name: logpodpath
              mountPath: /var/log/pods
              readOnly: true
            - name: logscontainerspath
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: dockersocket
          hostPath:
            path: /var/run/docker.sock
        - name: procdir
          hostPath:
            path: /proc
        - name: cgroups
          hostPath:
            path: /sys/fs/cgroup
        - name: pointerdir
          hostPath:
            path: /opt/datadog-agent/run
        - name: logpodpath
          hostPath:
            path: /var/log/pods
        - name: logscontainerspath
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-agent
  namespace: fcg
  labels:
    app: datadog-agent
spec:
  selector:
    app: datadog-agent
  ports:
    - port: 8125
      targetPort: 8125
      protocol: UDP
      name: dogstatsd
    - port: 8126
      targetPort: 8126
      protocol: TCP
      name: trace
  internalTrafficPolicy: Local
