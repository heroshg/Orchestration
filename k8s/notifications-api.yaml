apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-api-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Username: "guest"
---
apiVersion: v1
kind: Secret
metadata:
  name: notifications-api-secret
  namespace: fcg
type: Opaque
stringData:
  RabbitMQ__Password: "Rmq$Fgc2026!Q5bT8xM6Y"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done']
      containers:
        - name: notifications-api
          image: notifications-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: notifications-api-config
            - secretRef:
                name: notifications-api-secret
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-api
  namespace: fcg
spec:
  selector:
    app: notifications-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
