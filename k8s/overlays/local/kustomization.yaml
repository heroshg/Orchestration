# =============================================================================
# Overlay LOCAL — dev em cluster local (kind / minikube / Docker Desktop).
# Aplicar: kubectl apply -k k8s/overlays/local --load-restrictor=LoadRestrictionsNone
#
# A flag --load-restrictor é necessária porque o configMapGenerator do base
# referencia arquivos em infrastructure/ (compartilhados com Compose). Sem
# ela, kustomize rejeita leituras fora do diretório por padrão.
#
# Pré-requisitos:
#   1. docker build -t fcg-localstack:local infrastructure/localstack/
#   2. docker build -t users-api:latest    ../UsersAPI
#      docker build -t catalog-api:latest  ../CatalogAPI
#      docker build -t payments-api:latest ../PaymentsAPI
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fcg

resources:
  - ../../base
  - localstack.yaml
  - sqs-secrets.yaml
