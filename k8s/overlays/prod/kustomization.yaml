# =============================================================================
# Overlay PROD — produção (EKS, com SQS/DynamoDB/Lambda reais provisionados
# pelo Terraform em infrastructure/terraform/).
# Aplicar: kubectl apply -k k8s/overlays/prod
# Pré-requisitos:
#   1. cp sqs-secrets.yaml.example sqs-secrets.yaml
#      Popular com os outputs do Terraform (queue URLs).
#   2. Imagens dos serviços publicadas no ECR (ver infrastructure/terraform/ecr.tf).
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fcg

resources:
  - ../../base
  - sqs-secrets.yaml
