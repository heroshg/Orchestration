# =============================================================================
# API Gateway local — Kong (DB-less). Substituto do AWS API Gateway v2.
# Os ConfigMaps 'kong-config', 'kong-entrypoint' e 'swagger-spec' são criados
# pelo bootstrap.sh a partir de infrastructure/kong/.
# Chave pública RSA vem do secret users-api-secret (JWT_RSA_PUBLIC_KEY base64).
# Entrypoint do cluster: kubectl port-forward svc/api-gateway 8080:8000
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fcg
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: kong
          image: kong:3.7.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/fcg-entrypoint.sh"]
          args: ["kong", "docker-start"]
          ports:
            - name: proxy
              containerPort: 8000
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: JWT_RSA_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: JWT_RSA_PUBLIC_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
              readOnly: true
            - name: kong-entrypoint
              mountPath: /usr/local/bin/fcg-entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: kong-prefix
              mountPath: /usr/local/kong
          readinessProbe:
            httpGet:
              path: /
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
        - name: kong-entrypoint
          configMap:
            name: kong-entrypoint
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
        - name: kong-prefix
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fcg
spec:
  selector:
    app: api-gateway
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
  type: ClusterIP
