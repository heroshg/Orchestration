# =============================================================================
# Base — manifests comuns a todos os ambientes (local com LocalStack, EKS, etc.)
# Aplicar via overlay: kubectl apply -k overlays/local | kubectl apply -k overlays/prod
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fcg

resources:
  # Infraestrutura
  - namespace.yaml
  - network-policies.yaml

  # Bancos de dados
  - users-postgres.yaml
  - catalog-postgres.yaml
  - payments-postgres.yaml
  - postgres-secrets.yaml

  # Mensageria + cache
  - rabbitmq.yaml
  - rabbitmq-secret.yaml
  - redis.yaml
  - redis-secret.yaml

  # Microsserviços
  - users-api.yaml
  - users-api-secret.yaml
  - catalog-api.yaml
  - catalog-api-secret.yaml
  - payments-api.yaml
  - payments-api-secret.yaml

  # API Gateway local (Kong) + Swagger UI agregado
  - api-gateway.yaml
  - swagger-ui.yaml

  # Observabilidade
  - datadog-agent.yaml
  - datadog-secret.yaml

# ConfigMaps gerados a partir dos arquivos-fonte em infrastructure/
# Mesma fonte da verdade do Compose — zero duplicação de conteúdo.
configMapGenerator:
  - name: kong-config
    files:
      - kong.yml=../../infrastructure/kong/kong.yml
  - name: kong-entrypoint
    files:
      - entrypoint.sh=../../infrastructure/kong/entrypoint.sh
  - name: swagger-spec
    files:
      - openapi.yaml=../../infrastructure/kong/openapi.yaml
  - name: datadog-checks
    files:
      - redisdb.yaml=../../infrastructure/datadog/redisdb.yaml
      - disk.yaml=../../infrastructure/datadog/disk.yaml

# Mantém os nomes dos ConfigMaps estáveis (sem hash) para que os Deployments
# que referenciam "kong-config" e "datadog-checks" funcionem direto.
generatorOptions:
  disableNameSuffixHash: true
