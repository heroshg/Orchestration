# Nega todo tráfego ingress por padrão no namespace fcg
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: fcg
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-users-api-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: users-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-catalog-api-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: catalog-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payments-api-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: payments-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fcg
---
# users-postgres: aceita ingress APENAS do users-api na porta 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-users-postgres-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: users-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: users-api
      ports:
        - port: 5432
---
# catalog-postgres: aceita ingress APENAS do catalog-api na porta 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-catalog-postgres-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: catalog-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catalog-api
      ports:
        - port: 5432
---
# payments-postgres: aceita ingress APENAS do payments-api na porta 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payments-postgres-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: payments-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: payments-api
      ports:
        - port: 5432
---
# rabbitmq: aceita ingress de users-api, catalog-api e payments-api na porta 5672
# Nota: notifications-api foi removido (migrado para AWS Lambda + SQS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: users-api
        - podSelector:
            matchLabels:
              app: catalog-api
        - podSelector:
            matchLabels:
              app: payments-api
      ports:
        - port: 5672
---
# redis: aceita ingress de users-api e catalog-api na porta 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: users-api
        - podSelector:
            matchLabels:
              app: catalog-api
      ports:
        - port: 6379
---
# datadog-agent: aceita tráfego APM (8126/tcp) e DogStatsD (8125/udp) vindo das APIs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datadog-agent-ingress
  namespace: fcg
spec:
  podSelector:
    matchLabels:
      app: datadog-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: users-api
        - podSelector:
            matchLabels:
              app: catalog-api
        - podSelector:
            matchLabels:
              app: payments-api
      ports:
        - port: 8126
          protocol: TCP
        - port: 8125
          protocol: UDP
