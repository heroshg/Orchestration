# =============================================================================
# Swagger UI agregador — serve o próprio spec OpenAPI (via ConfigMap
# swagger-spec criado pelo bootstrap a partir de infrastructure/kong/).
# Acessível via api-gateway em /swagger.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  namespace: fcg
  labels:
    app: swagger-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger-ui
  template:
    metadata:
      labels:
        app: swagger-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: swagger-ui
          image: swaggerapi/swagger-ui:v5.17.14
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: BASE_URL,      value: /swagger }
            - { name: URL,           value: /swagger/openapi.yaml }
            - { name: LAYOUT,        value: BaseLayout }
            - { name: DEEP_LINKING,  value: "true" }
          resources:
            requests: { memory: "64Mi",  cpu: "100m" }
            limits:   { memory: "128Mi", cpu: "250m" }
          volumeMounts:
            - name: swagger-spec
              mountPath: /usr/share/nginx/html/swagger/openapi.yaml
              subPath: openapi.yaml
              readOnly: true
      volumes:
        - name: swagger-spec
          configMap:
            name: swagger-spec
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-ui
  namespace: fcg
spec:
  selector:
    app: swagger-ui
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
