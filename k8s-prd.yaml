# Orchestration (plataforma) — recursos cluster/namespace-scoped do ambiente prd.
# Os Deployments/Services de cada API vivem no repo do próprio serviço (spec 07) — este
# arquivo só cria o que é da plataforma: namespace, isolamento de rede, quotas e o ESO.
# Aplicar ANTES dos serviços: kubectl apply -f k8s-prd.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: fcg-prd
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fcg-prd-quota
  namespace: fcg-prd
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "40"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: fcg-prd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ClusterSecretStore já é criado pelo k8s-dev.yaml (recurso cluster-scoped, único no cluster);
# reaplicar aqui é idempotente caso prd seja aplicado isoladamente. Ver k8s-dev.yaml para a nota
# sobre `auth.secretRef` (fallback do Learner Lab — IMDS do node role não é alcançável pelo pod do ESO).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fcg-secretstore
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-lab-creds
            namespace: external-secrets
            key: access-key
          secretAccessKeySecretRef:
            name: aws-lab-creds
            namespace: external-secrets
            key: secret-access-key
          sessionTokenSecretRef:
            name: aws-lab-creds
            namespace: external-secrets
            key: session-token
