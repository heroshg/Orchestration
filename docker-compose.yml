services:

  payments-postgres:
    image: postgres:16-alpine
    container_name: fcg-payments-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: payments_db
    volumes:
      - payments-postgres-data:/var/lib/postgresql/data
    networks:
      - payments-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  users-postgres:
    image: postgres:16-alpine
    container_name: fcg-users-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: users_db
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
    networks:
      - users-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  catalog-postgres:
    image: postgres:16-alpine
    container_name: fcg-catalog-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: catalog_db
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    networks:
      - catalog-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  redis:
    image: redis:7.2-alpine
    container_name: fcg-redis
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    ports:
      - "6379:6379"
    networks:
      - cache
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: fcg-swagger-ui
    environment:
      BASE_URL: /swagger
      URL: /swagger/openapi.yaml
      LAYOUT: BaseLayout
      DEEP_LINKING: "true"
    volumes:
      - ./infrastructure/kong/openapi.yaml:/usr/share/nginx/html/swagger/openapi.yaml:ro
    networks:
      - messaging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  api-gateway:
    image: kong:3.7.1
    container_name: fcg-api-gateway
    entrypoint: ["/usr/local/bin/fcg-entrypoint.sh"]
    command: ["kong", "docker-start"]
    ports:
      - "8080:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      JWT_RSA_PUBLIC_KEY: "${JWT_RSA_PUBLIC_KEY}"
      JWT_RSA_PUBLIC_KEY_PEM: "${JWT_RSA_PUBLIC_KEY_PEM:-}"
    volumes:
      - ./infrastructure/kong/kong.yml:/etc/kong/kong.yml:ro
      - ./infrastructure/kong/entrypoint.sh:/usr/local/bin/fcg-entrypoint.sh:ro
    networks:
      - messaging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started
      swagger-ui:
        condition: service_started

  localstack:
    image: localstack/localstack:3.7
    container_name: fcg-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: "sqs,dynamodb,lambda,logs,sts,s3"
      AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"
      DEBUG: "0"
      # Desabilita executor Docker para Lambda: Lambda roda in-process no LocalStack
      # (evita dependência de /var/run/docker.sock — não funciona no Windows/WSL2).
      LAMBDA_DOCKER_ENABLED: "0"
      USERS_API_INTERNAL_URL: "http://users-api:8080"
      CATALOG_API_INTERNAL_URL: "http://catalog-api:8080"
    volumes:
      - ./infrastructure/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - ./infrastructure/localstack/.build:/opt/code/lambda:ro
    networks:
      aws-local:
        aliases:
          - localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fcg-rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    networks:
      - messaging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 300s

  users-api:
    image: users-api:latest
    build:
      context: ../UsersAPI
      dockerfile: Dockerfile
    container_name: fcg-users-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Users: "Host=users-postgres;Port=5432;Database=users_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__RsaPrivateKey: "${JWT_RSA_PRIVATE_KEY}"
      Jwt__RsaPublicKey: "${JWT_RSA_PUBLIC_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      AWS__Region: "${AWS_REGION:-us-east-1}"
      AWS__SQS__UserCreatedQueueUrl: "http://localstack:4566/000000000000/fcg-local-user-created-events"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ENDPOINT_URL_SQS: "http://localstack:4566"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    networks:
      - users-db
      - messaging
      - cache
      - aws-local
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      users-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: on-failure
    develop:
      watch:
        - action: rebuild
          path: ../UsersAPI/src
          ignore: [bin/, obj/]
        - action: rebuild
          path: ../UsersAPI/Dockerfile

  catalog-api:
    image: catalog-api:latest
    build:
      context: ../CatalogAPI
      dockerfile: Dockerfile
    container_name: fcg-catalog-api
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__RsaPublicKey: "${JWT_RSA_PUBLIC_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      AWS__Region: "${AWS_REGION:-us-east-1}"
      AWS__ServiceURL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    networks:
      - messaging
      - cache
      - aws-local
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      localstack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    develop:
      watch:
        - action: rebuild
          path: ../CatalogAPI/src
          ignore: [bin/, obj/]
        - action: rebuild
          path: ../CatalogAPI/Dockerfile

  payments-api:
    image: payments-api:latest
    build:
      context: ../PaymentsAPI
      dockerfile: Dockerfile
    container_name: fcg-payments-api
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Payments: "Host=payments-postgres;Port=5432;Database=payments_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__RsaPublicKey: "${JWT_RSA_PUBLIC_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      AWS__Region: "${AWS_REGION:-us-east-1}"
      AWS__SQS__PaymentProcessedQueueUrl: "http://localstack:4566/000000000000/fcg-local-payment-processed-events"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ENDPOINT_URL_SQS: "http://localstack:4566"
    networks:
      - payments-db
      - messaging
      - aws-local
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      payments-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: on-failure
    develop:
      watch:
        - action: rebuild
          path: ../PaymentsAPI/src
          ignore: [bin/, obj/]
        - action: rebuild
          path: ../PaymentsAPI/Dockerfile

  # NotificationsAPI removido — migrado para AWS Lambda (Fase 3)

networks:
  users-db:
    driver: bridge
  catalog-db:
    driver: bridge
  payments-db:
    driver: bridge
  messaging:
    driver: bridge
  cache:
    driver: bridge
  aws-local:
    name: fcg-aws-local
    driver: bridge

volumes:
  users-postgres-data:
  catalog-postgres-data:
  payments-postgres-data:
