services:

  # ═══════════════════════════════════════════════════════════════════════════
  # Bancos de Dados — PostgreSQL
  # ═══════════════════════════════════════════════════════════════════════════

  payments-postgres:
    image: postgres:16-alpine
    container_name: fcg-payments-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: payments_db
    volumes:
      - payments-postgres-data:/var/lib/postgresql/data
    networks:
      - payments-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  users-postgres:
    image: postgres:16-alpine
    container_name: fcg-users-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: users_db
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
    networks:
      - users-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  catalog-postgres:
    image: postgres:16-alpine
    container_name: fcg-catalog-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: catalog_db
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    networks:
      - catalog-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ═══════════════════════════════════════════════════════════════════════════
  # Cache — Redis
  # ═══════════════════════════════════════════════════════════════════════════

  redis:
    image: redis:7.2-alpine
    container_name: fcg-redis
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    ports:
      - "6379:6379"
    networks:
      - cache
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # Observabilidade — Datadog Agent (Opção B — APM gerenciado)
  # ═══════════════════════════════════════════════════════════════════════════

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.58.0
    container_name: fcg-datadog-agent
    environment:
      DD_API_KEY: "${DD_API_KEY}"
      DD_SITE: "${DD_SITE:-datadoghq.com}"
      DD_ENV: "development"
      DD_TAGS: "project:fiapcloudgames phase:3"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:fcg-datadog-agent"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"   # lida pelo template %%env_REDIS_PASSWORD%% do redisdb check
    ports:
      - "8126:8126"   # APM / traces
      - "8125:8125/udp"  # DogStatsD
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - ./infrastructure/datadog/redisdb.yaml:/etc/datadog-agent/conf.d/redisdb.d/conf.yaml:ro
      - ./infrastructure/datadog/disk.yaml:/etc/datadog-agent/conf.d/disk.d/conf.yaml:ro
    networks:
      - observability
      - messaging
      - cache
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ═══════════════════════════════════════════════════════════════════════════
  # API Gateway (local) — Nginx como substituto do AWS API Gateway v2.
  # Em produção: aws_apigatewayv2_api (Terraform). Aqui replica rotas+CORS.
  # Entrypoint único: http://localhost:8080
  # ═══════════════════════════════════════════════════════════════════════════

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: fcg-swagger-ui
    environment:
      BASE_URL: /swagger
      URL: /swagger/openapi.yaml
      LAYOUT: BaseLayout
      DEEP_LINKING: "true"
    networks:
      - messaging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  api-gateway:
    image: nginx:1.27-alpine
    container_name: fcg-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/openapi.yaml:/etc/nginx/openapi.yaml:ro
    networks:
      - messaging   # rede compartilhada com users-api, catalog-api e swagger-ui
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started
      swagger-ui:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════════════════
  # AWS local — LocalStack
  # Emula SQS + DynamoDB + Lambda + IAM. Inicializado por init-aws.sh
  # que cria as filas, a tabela e a função (com event source mappings).
  # ═══════════════════════════════════════════════════════════════════════════

  localstack:
    image: localstack/localstack:3.8
    container_name: fcg-localstack
    ports:
      - "4566:4566"   # Edge port (todos os serviços AWS)
    environment:
      SERVICES: "sqs,dynamodb,lambda,iam,logs,sts,cloudwatch,apigateway,apigatewayv2,s3"
      AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"
      DEBUG: "0"
      LAMBDA_EXECUTOR: "docker"
      LAMBDA_DOCKER_NETWORK: "fcg-aws-local"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      USERS_API_INTERNAL_URL: "http://users-api:8080"
      CATALOG_API_INTERNAL_URL: "http://catalog-api:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infrastructure/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - ./infrastructure/localstack/.build:/opt/code/lambda:ro
    networks:
      aws-local:
        aliases:
          - localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # Mensageria — RabbitMQ (desenvolvimento local)
  # Em produção: AWS SQS (configurado via SAM em infrastructure/sam/)
  # ═══════════════════════════════════════════════════════════════════════════

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fcg-rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    networks:
      - messaging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 300s

  # ═══════════════════════════════════════════════════════════════════════════
  # Microsserviços
  # ═══════════════════════════════════════════════════════════════════════════

  users-api:
    image: users-api:latest
    build:
      context: ../UsersAPI
      dockerfile: Dockerfile
    container_name: fcg-users-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Users: "Host=users-postgres;Port=5432;Database=users_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__RsaPrivateKey: "${JWT_RSA_PRIVATE_KEY}"
      Jwt__RsaPublicKey: "${JWT_RSA_PUBLIC_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      # Desenvolvimento local: usa RabbitMQ
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      # ─── AWS (apontando para LocalStack em dev) ───────────────────────
      AWS__Region: "${AWS_REGION:-us-east-1}"
      AWS__SQS__UserCreatedQueueUrl: "http://localstack:4566/000000000000/fcg-local-user-created-events"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ENDPOINT_URL_SQS: "http://localstack:4566"
      # Cache
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      # ─── Datadog APM ──────────────────────────────────────────────────
      DD_SERVICE: "users-api"
      DD_ENV: "development"
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: "datadog-agent"
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_TRACE_SAMPLE_RATE: "1.0"
      DD_PROFILING_ENABLED: "true"
      DD_TRACE_LOG_DIRECTORY: "/tmp/dd-logs"
      DD_DOTNET_TRACER_HOME: "/app/datadog"
      CORECLR_ENABLE_PROFILING: "1"
      CORECLR_PROFILER: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
      CORECLR_PROFILER_PATH: "/app/datadog/linux-musl-x64/Datadog.Trace.ClrProfiler.Native.so"
      LD_PRELOAD: "/app/datadog/linux-musl-x64/Datadog.Linux.ApiWrapper.x64.so"
    labels:
      com.datadoghq.tags.service: "users-api"
      com.datadoghq.tags.env: "development"
      com.datadoghq.tags.version: "1.0.0"
    networks:
      - users-db
      - messaging
      - cache
      - observability
      - aws-local
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      users-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: on-failure

  catalog-api:
    image: catalog-api:latest
    build:
      context: ../CatalogAPI
      dockerfile: Dockerfile
    container_name: fcg-catalog-api
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: "Host=catalog-postgres;Port=5432;Database=catalog_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__RsaPublicKey: "${JWT_RSA_PUBLIC_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      # Cache
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      # ─── Datadog APM ──────────────────────────────────────────────────
      DD_SERVICE: "catalog-api"
      DD_ENV: "development"
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: "datadog-agent"
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_TRACE_SAMPLE_RATE: "1.0"
      DD_PROFILING_ENABLED: "true"
      DD_TRACE_LOG_DIRECTORY: "/tmp/dd-logs"
      DD_DOTNET_TRACER_HOME: "/app/datadog"
      CORECLR_ENABLE_PROFILING: "1"
      CORECLR_PROFILER: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
      CORECLR_PROFILER_PATH: "/app/datadog/linux-musl-x64/Datadog.Trace.ClrProfiler.Native.so"
      LD_PRELOAD: "/app/datadog/linux-musl-x64/Datadog.Linux.ApiWrapper.x64.so"
    labels:
      com.datadoghq.tags.service: "catalog-api"
      com.datadoghq.tags.env: "development"
      com.datadoghq.tags.version: "1.0.0"
    networks:
      - catalog-db
      - messaging
      - cache
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      catalog-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  payments-api:
    image: payments-api:latest
    build:
      context: ../PaymentsAPI
      dockerfile: Dockerfile
    container_name: fcg-payments-api
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Payments: "Host=payments-postgres;Port=5432;Database=payments_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__RsaPublicKey: "${JWT_RSA_PUBLIC_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      # Desenvolvimento local: usa RabbitMQ
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      # ─── AWS (apontando para LocalStack em dev) ───────────────────────
      AWS__Region: "${AWS_REGION:-us-east-1}"
      AWS__SQS__PaymentProcessedQueueUrl: "http://localstack:4566/000000000000/fcg-local-payment-processed-events"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ENDPOINT_URL_SQS: "http://localstack:4566"
      # ─── Datadog APM ──────────────────────────────────────────────────
      DD_SERVICE: "payments-api"
      DD_ENV: "development"
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: "datadog-agent"
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_TRACE_SAMPLE_RATE: "1.0"
      DD_PROFILING_ENABLED: "true"
      DD_TRACE_LOG_DIRECTORY: "/tmp/dd-logs"
      DD_DOTNET_TRACER_HOME: "/app/datadog"
      CORECLR_ENABLE_PROFILING: "1"
      CORECLR_PROFILER: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
      CORECLR_PROFILER_PATH: "/app/datadog/linux-musl-x64/Datadog.Trace.ClrProfiler.Native.so"
      LD_PRELOAD: "/app/datadog/linux-musl-x64/Datadog.Linux.ApiWrapper.x64.so"
    labels:
      com.datadoghq.tags.service: "payments-api"
      com.datadoghq.tags.env: "development"
      com.datadoghq.tags.version: "1.0.0"
    networks:
      - payments-db
      - messaging
      - observability
      - aws-local
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      payments-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: on-failure

  # ═══════════════════════════════════════════════════════════════════════════
  # NotificationsAPI — REMOVIDO
  # Migrado para AWS Lambda (Fase 3)
  # Infraestrutura: infrastructure/sam/template.yaml
  # Deploy:        infrastructure/sam/deploy.sh
  # ═══════════════════════════════════════════════════════════════════════════

networks:
  users-db:
    driver: bridge
  catalog-db:
    driver: bridge
  payments-db:
    driver: bridge
  messaging:
    driver: bridge
  cache:
    driver: bridge
  observability:
    driver: bridge
  aws-local:
    name: fcg-aws-local
    driver: bridge

volumes:
  users-postgres-data:
  catalog-postgres-data:
  payments-postgres-data:
