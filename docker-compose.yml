services:

  # ═══════════════════════════════════════════════════════════════════════════
  # Bancos de Dados — PostgreSQL
  # ═══════════════════════════════════════════════════════════════════════════

  payments-postgres:
    image: postgres:16-alpine
    container_name: fcg-payments-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: payments_db
    volumes:
      - payments-postgres-data:/var/lib/postgresql/data
    networks:
      - payments-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  users-postgres:
    image: postgres:16-alpine
    container_name: fcg-users-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: users_db
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
    networks:
      - users-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  catalog-postgres:
    image: postgres:16-alpine
    container_name: fcg-catalog-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: catalog_db
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    networks:
      - catalog-db
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ═══════════════════════════════════════════════════════════════════════════
  # Cache — Redis
  # ═══════════════════════════════════════════════════════════════════════════

  redis:
    image: redis:7.2-alpine
    container_name: fcg-redis
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    ports:
      - "6379:6379"
    networks:
      - cache
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # Observabilidade — Datadog Agent (Opção B — APM gerenciado)
  # ═══════════════════════════════════════════════════════════════════════════

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.58.0
    container_name: fcg-datadog-agent
    environment:
      DD_API_KEY: "${DD_API_KEY}"
      DD_SITE: "${DD_SITE:-datadoghq.com}"
      DD_ENV: "development"
      DD_TAGS: "project:fiapcloudgames phase:3"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:fcg-datadog-agent"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
    ports:
      - "8126:8126"   # APM / traces
      - "8125:8125/udp"  # DogStatsD
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - observability
      - messaging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ═══════════════════════════════════════════════════════════════════════════
  # Mensageria — RabbitMQ (desenvolvimento local)
  # Em produção: AWS SQS (configurado via SAM em infrastructure/sam/)
  # ═══════════════════════════════════════════════════════════════════════════

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fcg-rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    networks:
      - messaging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 300s

  # ═══════════════════════════════════════════════════════════════════════════
  # Microsserviços
  # ═══════════════════════════════════════════════════════════════════════════

  users-api:
    image: users-api:latest
    container_name: fcg-users-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Users: "Host=users-postgres;Port=5432;Database=users_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      # Desenvolvimento local: usa RabbitMQ
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      # Produção AWS: descomente e configure as variáveis abaixo
      # Messaging__Provider: "SQS"
      # AWS__Region: "${AWS_REGION}"
      # AWS__SQS__UserCreatedQueueUrl: "${SQS_USER_CREATED_QUEUE_URL}"
      # Cache
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      # ─── Datadog APM ──────────────────────────────────────────────────
      DD_SERVICE: "users-api"
      DD_ENV: "development"
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: "datadog-agent"
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_TRACE_SAMPLE_RATE: "1.0"
      DD_PROFILING_ENABLED: "true"
      DD_TRACE_LOG_DIRECTORY: "/tmp/dd-logs"
      DD_DOTNET_TRACER_HOME: "/app/datadog"
      CORECLR_ENABLE_PROFILING: "1"
      CORECLR_PROFILER: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
      CORECLR_PROFILER_PATH: "/app/datadog/linux-musl-x64/Datadog.Trace.ClrProfiler.Native.so"
      LD_PRELOAD: "/app/datadog/linux-musl-x64/Datadog.Linux.ApiWrapper.x64.so"
    labels:
      com.datadoghq.tags.service: "users-api"
      com.datadoghq.tags.env: "development"
      com.datadoghq.tags.version: "1.0.0"
    networks:
      - users-db
      - messaging
      - cache
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      users-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  catalog-api:
    image: catalog-api:latest
    container_name: fcg-catalog-api
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: "Host=catalog-postgres;Port=5432;Database=catalog_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      # Cache
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      # ─── Datadog APM ──────────────────────────────────────────────────
      DD_SERVICE: "catalog-api"
      DD_ENV: "development"
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: "datadog-agent"
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_TRACE_SAMPLE_RATE: "1.0"
      DD_PROFILING_ENABLED: "true"
      DD_TRACE_LOG_DIRECTORY: "/tmp/dd-logs"
      DD_DOTNET_TRACER_HOME: "/app/datadog"
      CORECLR_ENABLE_PROFILING: "1"
      CORECLR_PROFILER: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
      CORECLR_PROFILER_PATH: "/app/datadog/linux-musl-x64/Datadog.Trace.ClrProfiler.Native.so"
      LD_PRELOAD: "/app/datadog/linux-musl-x64/Datadog.Linux.ApiWrapper.x64.so"
    labels:
      com.datadoghq.tags.service: "catalog-api"
      com.datadoghq.tags.env: "development"
      com.datadoghq.tags.version: "1.0.0"
    networks:
      - catalog-db
      - messaging
      - cache
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      catalog-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  payments-api:
    image: payments-api:latest
    container_name: fcg-payments-api
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Payments: "Host=payments-postgres;Port=5432;Database=payments_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      # Desenvolvimento local: usa RabbitMQ
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      # Produção AWS: descomente e configure as variáveis abaixo
      # Messaging__Provider: "SQS"
      # AWS__Region: "${AWS_REGION}"
      # AWS__SQS__PaymentProcessedQueueUrl: "${SQS_PAYMENT_PROCESSED_QUEUE_URL}"
      # ─── Datadog APM ──────────────────────────────────────────────────
      DD_SERVICE: "payments-api"
      DD_ENV: "development"
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: "datadog-agent"
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_TRACE_SAMPLE_RATE: "1.0"
      DD_PROFILING_ENABLED: "true"
      DD_TRACE_LOG_DIRECTORY: "/tmp/dd-logs"
      DD_DOTNET_TRACER_HOME: "/app/datadog"
      CORECLR_ENABLE_PROFILING: "1"
      CORECLR_PROFILER: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
      CORECLR_PROFILER_PATH: "/app/datadog/linux-musl-x64/Datadog.Trace.ClrProfiler.Native.so"
      LD_PRELOAD: "/app/datadog/linux-musl-x64/Datadog.Linux.ApiWrapper.x64.so"
    labels:
      com.datadoghq.tags.service: "payments-api"
      com.datadoghq.tags.env: "development"
      com.datadoghq.tags.version: "1.0.0"
    networks:
      - payments-db
      - messaging
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      payments-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # ═══════════════════════════════════════════════════════════════════════════
  # NotificationsAPI — REMOVIDO
  # Migrado para AWS Lambda (Fase 3)
  # Infraestrutura: infrastructure/sam/template.yaml
  # Deploy:        infrastructure/sam/deploy.sh
  # ═══════════════════════════════════════════════════════════════════════════

networks:
  users-db:
    driver: bridge
  catalog-db:
    driver: bridge
  payments-db:
    driver: bridge
  messaging:
    driver: bridge
  cache:
    driver: bridge
  observability:
    driver: bridge

volumes:
  users-postgres-data:
  catalog-postgres-data:
  payments-postgres-data:
